name: brightdata
version: 0.2.1
description: Bright Data web data tools — search, scrape, structured datasets, residential proxy, and browser automation.
author: Dante Labs
provides_tools:
  - search_engine
  - scrape
  - scrape_batch
  - web_data
  - proxy_scrape
  - session_stats
  - browser_navigate
  - browser_snapshot
  - browser_act
  - browser_get
provides_hooks:
  - on_session_end
requires_env:
  - name: BRIGHTDATA_API_TOKEN
    secret: true
    description: Bright Data API token (Account settings → API keys).
optional_env:
  - name: BRIGHTDATA_WEB_UNLOCKER_ZONE
    description: Web Unlocker zone name (default web_unlocker1).
  - name: BRIGHTDATA_SERP_ZONE
    description: SERP API zone name (default serp_api1).
  - name: BRIGHTDATA_BROWSER_AUTH
    secret: true
    description: "Scraping Browser auth: brd-customer-<id>-zone-<zone>:<password>."
  - name: BRIGHTDATA_PROXY_AUTH
    secret: true
    description: "Residential proxy auth: brd-customer-<id>-zone-<residential-zone>:<password>."
  - name: BRIGHTDATA_PROXY_CA
    description: Path to the Bright Data proxy CA cert (for HTTPS via proxy, port 33335).
  - name: BRIGHTDATA_PROXY_HOST
    description: Proxy host:port (default brd.superproxy.io:33335).
